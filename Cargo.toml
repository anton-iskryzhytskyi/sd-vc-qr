[package]
name = "sd-vc-qr"
version = "1.0.1"
edition = "2024"

[dependencies]
base64 = "0.22.0"
chrono = "0.4.40"
k256 = { version = "0.13.4", features = ["ecdsa", "std"] }
p256 = { version = "0.13.2", features = ["ecdsa", "std"] }
ed25519-dalek = { version = "2.0.0", features = ["rand_core"] }
pqcrypto-falcon = "0.3.0"
pqcrypto-sphincsplus = "0.7.1"
multibase = "0.9.1"
pqcrypto-dilithium = "0.5.0"
pqcrypto-traits = "0.3.5"
rand_core = "0.6"
rand = "0.8"   
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unsigned-varint = "0.8.0"
uuid = { version = "1.16.0", features = ["v4"] }
sha2 = "0.10.8"

[dev-dependencies]
criterion = "0.5"
thousands = "0.2"
byte-unit = "4.0"

[[bench]]
name = "sd_jwt_vc_benchmark"
harness = false

authors = ["Anton Iskyzhytskyi <a.iskryzhytskyi@gmail.com>"]